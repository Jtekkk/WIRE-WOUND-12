name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: iscc packaging\installer.iss "/DBuildDir=%CD%\build\FLUXCORE12_artefacts\Release"

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FLUXCORE-12-Windows-Installer
          path: packaging/Output/FLUXCORE-12-Installer.exe
          if-no-files-found: error

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: FLUXCORE-12-artefacts-${{ matrix.os }}
          path: build/FLUXCORE12_artefacts/Release/**
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          # Attach the Windows installer .exe directly.
          if [ -f "dist/FLUXCORE-12-Windows-Installer/FLUXCORE-12-Installer.exe" ]; then
            cp "dist/FLUXCORE-12-Windows-Installer/FLUXCORE-12-Installer.exe" release-assets/
          fi
          # Zip the raw VST3/Standalone artefacts per OS.
          for d in dist/FLUXCORE-12-artefacts-*; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            (cd "$d" && zip -r "../../release-assets/${name}.zip" .)
          done
          ls -R release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
